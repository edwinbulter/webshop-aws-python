{% extends "base.html" %}
{% block title %}Inloggen{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
  <h1 class="text-2xl font-extrabold mb-4">Inloggen</h1>
  <form method="post" action="/login" class="space-y-3">
    <input type="hidden" name="next" value="{{ next|default('') }}">
    <div>
      <label for="email" class="block text-sm font-medium mb-1">E-mailadres</label>
      <input type="email" name="email" id="email" required value="{{ email|default('') }}"
             class="w-full border rounded px-3 py-2">
    </div>
    <div>
      <label for="password" class="block text-sm font-medium mb-1">Wachtwoord</label>
      <input type="password" name="password" id="password" required class="w-full border rounded px-3 py-2">
    </div>
    <button type="submit" class="w-full bg-[#0058a3] text-white font-semibold rounded py-2 hover:bg-[#004a87]">
      Inloggen
    </button>
  </form>
  <div class="flex justify-between text-sm text-gray-600 mt-4">
    <a href="/register" class="text-[#0058a3] hover:underline">Account aanmaken</a>
    <a href="/forgot-password" class="text-[#0058a3] hover:underline">Wachtwoord vergeten?</a>
  </div>
</div>
{% endblock %}
