{% extends "base.html" %}
{% block title %}Nieuw wachtwoord instellen{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
  <h1 class="text-2xl font-extrabold mb-4">Nieuw wachtwoord instellen</h1>
  <form method="post" action="/reset-password" class="space-y-3">
    <input type="hidden" name="email" value="{{ email }}">
    <div>
      <label for="code" class="block text-sm font-medium mb-1">Verificatiecode</label>
      <input type="text" name="code" id="code" required inputmode="numeric"
             class="w-full border rounded px-3 py-2">
    </div>
    <div>
      <label for="password" class="block text-sm font-medium mb-1">Nieuw wachtwoord</label>
      <input type="password" name="password" id="password" required minlength="8"
             class="w-full border rounded px-3 py-2">
    </div>
    <div>
      <label for="password_confirm" class="block text-sm font-medium mb-1">Bevestig nieuw wachtwoord</label>
      <input type="password" name="password_confirm" id="password_confirm" required minlength="8"
             class="w-full border rounded px-3 py-2">
    </div>
    <button type="submit" class="w-full bg-[#0058a3] text-white font-semibold rounded py-2 hover:bg-[#004a87]">
      Wachtwoord wijzigen
    </button>
  </form>
</div>
{% endblock %}
