{% extends "base.html" %}
{% block title %}Wachtwoord vergeten{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
  <h1 class="text-2xl font-extrabold mb-2">Wachtwoord vergeten</h1>
  <p class="text-gray-600 mb-4">
    Vul je e-mailadres in. Als dit account bestaat, sturen we een verificatiecode.
  </p>
  <form method="post" action="/forgot-password" class="space-y-3">
    <div>
      <label for="email" class="block text-sm font-medium mb-1">E-mailadres</label>
      <input type="email" name="email" id="email" required class="w-full border rounded px-3 py-2">
    </div>
    <button type="submit" class="w-full bg-[#0058a3] text-white font-semibold rounded py-2 hover:bg-[#004a87]">
      Verstuur code
    </button>
  </form>
</div>
{% endblock %}
