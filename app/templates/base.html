<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Bureaulampen{% endblock %} · Nordic Wonen (PoC)</title>
  <script
    src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"
    integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
    crossorigin="anonymous"></script>
  <script
    src="https://cdn.tailwindcss.com/3.4.16"
    integrity="sha384-mS5Uq7sE90lgbBDN8xgf34ibEgbZo4gB3tfLY40ZRle+M188BQw8onzNHg6GUZaA"
    crossorigin="anonymous"></script>
</head>
<body class="bg-[#f5f5f3] text-gray-900 min-h-screen flex flex-col">
  <header class="bg-[#0058a3] text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="text-2xl font-extrabold tracking-tight">Nordic Wonen</a>
      <nav class="flex items-center gap-4">
        <a href="/" class="hover:underline">Bureaulampen</a>
        <a href="/cart" class="relative hover:underline">
          Winkelwagen
          <span id="cart-count"
                class="ml-1 inline-flex items-center justify-center bg-[#ffcc00] text-[#0058a3] font-bold rounded-full w-6 h-6 text-sm align-middle">{{ cart_count|default(0) }}</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-xs text-gray-500 py-6">
    Portfolio proof-of-concept &middot; niet gelieerd aan IKEA&reg; &middot; alle productfoto's zijn eigendom van Inter IKEA Systems B.V.
  </footer>
</body>
</html>
