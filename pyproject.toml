[project]
name = "webshop-aws-python"
version = "0.1.0"
description = "Serverless event-driven webshop PoC (portfolio project) op AWS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flask==3.1.0",
    "mangum==0.19.0",
    "asgiref==3.8.1",
    "boto3==1.35.91",
    "botocore==1.35.91",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-playwright==0.6.2",
    "playwright==1.49.1",
    "moto[server]==5.0.24",
    "ruff==0.8.4",
    "black==24.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# integration before e2e: Playwright's sync API leaves a running asyncio event
# loop on the main thread, which breaks Mangum's own run_until_complete call in
# the Lambda-packaging tests if e2e runs first in the same process.
testpaths = ["tests/integration", "tests/e2e"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.black]
line-length = 110
target-version = ["py313"]
