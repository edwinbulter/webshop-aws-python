name: Deploy code to AWS

# Manual only, on purpose: this pipeline redeploys Lambda code to a live AWS
# environment. It never touches infrastructure -- no Terraform at all here,
# deliberately: it calls `aws lambda update-function-code` directly on the 4
# already-existing functions. Infrastructure changes are applied by a human,
# locally, per README.md's "Deployment naar AWS" section.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gates this job on the GitHub Environment's required-reviewer rule (set
    # up once in the repo's Settings -> Environments -> production), and
    # scopes the OIDC trust policy to runs under this environment specifically
    # (see terraform/modules/github_oidc). Manual trigger + manual approval.
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Reuses the exact same build script Terraform's own lambda module calls
      # (terraform/modules/lambda/scripts/build.sh) -- one build process,
      # whether a human runs `terraform apply` locally or this workflow
      # deploys code-only. install_dependencies=true bundles
      # flask/mangum/asgiref/boto3/botocore, which aren't present in the
      # Lambda runtime.
      - name: Build and deploy webshop-main-app
        run: |
          bash terraform/modules/lambda/scripts/build.sh \
            "$RUNNER_TEMP/webshop-main-app" "$GITHUB_WORKSPACE" true app
          (cd "$RUNNER_TEMP/webshop-main-app" && zip -rq "$RUNNER_TEMP/webshop-main-app.zip" .)
          aws lambda update-function-code --function-name webshop-main-app \
            --zip-file "fileb://$RUNNER_TEMP/webshop-main-app.zip" --no-cli-pager
          aws lambda wait function-updated --function-name webshop-main-app

      # The 3 consumers only need `app` + `consumers` copied in (no
      # install_dependencies): they use nothing but boto3, which Lambda's
      # runtime already provides.
      - name: Build and deploy the 3 consumer Lambdas
        run: |
          for name in webshop-payment-service webshop-inventory-service webshop-notification-service; do
            bash terraform/modules/lambda/scripts/build.sh \
              "$RUNNER_TEMP/$name" "$GITHUB_WORKSPACE" false app consumers
            (cd "$RUNNER_TEMP/$name" && zip -rq "$RUNNER_TEMP/$name.zip" .)
            aws lambda update-function-code --function-name "$name" \
              --zip-file "fileb://$RUNNER_TEMP/$name.zip" --no-cli-pager
            aws lambda wait function-updated --function-name "$name"
          done
